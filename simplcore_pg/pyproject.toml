[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplcore-pg"
version = "1.0.0"
description = "SimplCore 生产级实现 (PyTorch 2.1)：共振场 / 动态记忆 / 拓扑路由 / 多模态 + torch.compile + FX"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = ["torch==2.1.2"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["simplcore_pg*"]

[tool.pytest.ini_options]
testpaths = ["../tests_simplcore_pg"]
pythonpath = ["."]
addopts = "-q"
