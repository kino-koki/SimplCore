[pytest]
# SimplCore — 测试入口
#
# 主线架构: simplcore/core   —— 非注意力 SimplCore（唯一产品线）
# 附属子系统: simplcore/safety —— 内容安全 / 越狱检测 / RBAC
# 研究归档:   research/        —— 早期路线原型，不参与 CI
testpaths =
    simplcore/core/tests
    simplcore/safety/tests
addopts = -q --no-header -p no:cacheprovider --basetemp=.pytest_tmp
filterwarnings =
    ignore::FutureWarning:torch.utils.checkpoint
    ignore::pytest.PytestReturnNotNoneWarning
