[pytest]
# SimplCore-V 0.1-ALPHA — 当前架构测试入口
# 主推架构: simplcore/sgc (SGC 因果谱全局卷积)
# 历史路径: simplcore_pg (RFP 因果性已修复) / simplcore/mix (NumPy 引擎, 非因果待修)
# 旧 qingxiaotuan 架构测试已归档至 .archive/legacy_tests/
testpaths =
    simplcore/sgc/tests
    simplcore_pg/test_integration_smoke.py
    simplcore/mix/tests
    simplcore/mix/test_fullstack.py
    safety/tests
    tests_simplcore_pg
addopts = -q --no-header -p no:cacheprovider --basetemp=.pytest_tmp
filterwarnings =
    ignore::FutureWarning:torch.utils.checkpoint
    ignore::pytest.PytestReturnNotNoneWarning
