# =============================================================================
# 青小团 70B MoE 分布式训练管线配置
# 青奈科技 (c) 2026
# =============================================================================

# 基本信息
company: "青奈科技"
model_name: "青小团"
experiment_name: "qingxiaotuan_70B_moe_pretrain_v1"
output_dir: "./training_output"
seed: 42

# =============================================================================
# 模型架构配置
# =============================================================================
model_config:
  model_type: "moe"
  hidden_size: 7168
  num_layers: 61
  num_attention_heads: 64
  num_key_value_heads: 8
  num_experts: 64
  top_k: 8
  moe_intermediate_size: 2048
  shared_intermediate_size: 1024
  vocab_size: 151936
  max_position_embeddings: 131072
  rms_norm_eps: 1e-6
  rope_theta: 1000000.0
  tie_word_embeddings: false
  activation_function: "silu"
  use_flash_attention: true
  attention_dropout: 0.0
  hidden_dropout: 0.0

# =============================================================================
# 训练超参数
# =============================================================================
training_config:
  batch_size: 4
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  min_learning_rate: 1e-5
  warmup_steps: 2000
  total_steps: 100000
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  activation_checkpointing: true
  use_flash_attention: true
  optimizer: "adamw"
  scheduler: "warmup_cosine"

# =============================================================================
# 分布式训练配置
# =============================================================================
distributed_config:
  world_size: 8
  num_nodes: 1
  data_parallel_size: 8
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  training_mode: "synchronous"
  communication_topology: "all_reduce"
  gradient_sync_every_n_steps: 1
  enable_communication_profiling: true

# =============================================================================
# 检查点配置
# =============================================================================
checkpoint_config:
  save_every_n_steps: 1000
  save_every_n_hours: 2.0
  save_best_on_loss: true
  keep_last_n: 5
  keep_best_k: 3
  max_checkpoints: 20
  enable_validation: true
  enable_async_checkpoint: true

# =============================================================================
# 监控配置
# =============================================================================
monitor_config:
  use_tensorboard: true
  use_wandb: false
  wandb_project: "qingxiaotuan_training"
  smooth_factor: 0.99
  alert_on_loss_spike: true
  alert_on_grad_explosion: true
  loss_spike_threshold: 10.0
  grad_norm_threshold: 100.0
  alert_interval_seconds: 300
  alert_webhook_url: ""
  alert_dingtalk_token: ""
  progress_bar_enabled: true

# =============================================================================
# 数据配置
# =============================================================================
data_config:
  train_data_path: "./data/pretrain/train"
  eval_data_path: "./data/pretrain/eval"
  data_cache_dir: "./data_cache"
  num_workers: 8
  prefetch_factor: 2
  max_seq_length: 8192
  dataset_type: "jsonl"
  shuffle_buffer_size: 10000

# =============================================================================
# 故障容错配置
# =============================================================================
fault_tolerance_config:
  enable_heartbeat: true
  heartbeat_interval: 5.0
  heartbeat_timeout: 30.0
  max_missed_heartbeats: 3
  enable_auto_restart: true
  max_restart_attempts: 3
  restart_delay: 10.0
  checkpoint_on_failure: true
  progress_persist_interval: 100
  enable_elastic_training: false

# =============================================================================
# 性能分析配置
# =============================================================================
profiling_config:
  enabled: true
  window_size: 100
  comm_overhead_threshold: 0.3
  data_overhead_threshold: 0.2
  gpu_idle_threshold: 0.3

# =============================================================================
# MoE 配置
# =============================================================================
moe_config:
  num_experts: 64
  top_k: 8
  expert_capacity: 2048
  shared_experts: 2
  z_loss_coef: 0.001
  load_balancing_loss_coef: 0.01
  expert_dropout: 0.0
  routing_method: "topk"
  normalization: "softmax"

# =============================================================================
# 多阶段训练配置
# =============================================================================
stages:
  - name: "pretrain"
    type: "pretrain"
    total_steps: 80000
    learning_rate: 1e-4
    batch_size: 4
    data_path: "./data/pretrain"
    checkpoint_interval: 1000

  - name: "sft"
    type: "sft"
    total_steps: 15000
    learning_rate: 5e-5
    batch_size: 2
    data_path: "./data/sft"
    checkpoint_interval: 500

  - name: "rlhf"
    type: "rlhf"
    total_steps: 5000
    learning_rate: 1e-5
    batch_size: 1
    data_path: "./data/rlhf"
    checkpoint_interval: 200
