# SimplCore 72B 训练配置
model:
  scale: "72B"
  d_model: 8192
  n_layers: 80
  n_bases: 2048
  n_heads: 64
  n_memory_channels: 128
  memory_dim: 8192
  n_paths: 16
  top_k: 4
  ffn_dim: 32768
  ffn_act: "swiglu"
  vocab_size_text: 32000
  vocab_size_image: 16384
  vocab_size_audio: 8192
  max_seq_len: 8192
  dropout: 0.1
  layernorm_eps: 1.0e-6

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32  # 4 * 8
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  warmup_steps: 2000
  total_steps: 500000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: "bf16"
  checkpoint_every: 1000
  log_every: 10
  eval_every: 500
  keep_checkpoint_max: 10

  # 学习率调度
  scheduler: "cosine"
  lr_warmup: "linear"

  # 数据
  dataset_size: 1000000000000  # 1T tokens
  epochs: 1

  # 稳定性
  loss_window_size: 100
  auto_lr_reduce_factor: 0.5
  auto_lr_reduce_patience: 5

hardware:
  gpu_count: 2
  gpu_type: "AMD MI250"
  gpu_memory: 128  # GB per GPU
  precision: "bf16"
  activation_checkpointing: true
  flash_attention: true

  # 分布式
  strategy: "hybrid"  # TP + DP
  tensor_parallel_size: 2
  data_parallel_size: 1
  pipeline_parallel_size: 1
  zero_optimization: 2  # ZeRO-2

  # 内存
  memory_pool_size: 120  # GB
  gradient_checkpointing_layers: 40  # 一半层使用

  # 通信
  communication_overlap: true
  gradient_compression: true
  compression_ratio: 0.5

